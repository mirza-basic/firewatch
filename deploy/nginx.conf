# Reverse proxy in front of `firewatch serve`. The app speaks plain HTTP on
# loopback and does not terminate TLS; this is where that happens.
#
# Certificates: certbot --nginx -d fire.example.org, or use Caddy, which does it
# without configuration.

server {
    listen 443 ssl http2;
    server_name fire.example.org;

    ssl_certificate     /etc/letsencrypt/live/fire.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fire.example.org/privkey.pem;

    # The map is a static page that reloads its own data every 60 seconds. Nothing
    # here is user-specific, so it caches well - except the data file itself.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health is for your monitoring, not for visitors. Drop the `allow`/`deny` pair
    # if an external uptime checker needs it - it exposes nothing sensitive, just
    # snapshot age and per-feed status.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    # Must never be cached: it is how the page learns there is a new fire.
    location = /fire-map-data.js {
        proxy_pass http://127.0.0.1:8080;
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 80;
    server_name fire.example.org;
    return 301 https://$host$request_uri;
}
