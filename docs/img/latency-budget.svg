<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Latency budget comparison. The Meteosat path totals about 39 minutes: up to 10 minutes waiting for the next look, 25 minutes provider publishing latency and up to 4 minutes of poll interval. The FIRMS best case totals about 200 minutes and the FIRMS worst case about 680 minutes because the wait for the next overpass can exceed 8 hours.">
<title>Latency budget comparison. The Meteosat path totals about 39 minutes: up to 10 minutes waiting for the next look, 25 minutes provider publishing latency and up to 4 minutes of poll interval. The FIRMS best case totals about 200 minutes and the FIRMS worst case about 680 minutes because the wait for the next overpass can exceed 8 hours.</title>
<style>
  .s-box{fill:#e7ecee; stroke:#cfd9dd; stroke-width:1}
  .s-box-hi{fill:#f6e3da; stroke:#bf4318; stroke-width:1.4}
  .s-line{stroke:#6a7b84; stroke-width:1.4; fill:none}
  .s-line-hi{stroke:#bf4318; stroke-width:1.8; fill:none}
  .s-dash{stroke:#6a7b84; stroke-width:1.2; fill:none; stroke-dasharray:4 3}
  .s-t{fill:#111a1f; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:12.5px}
  .s-t-b{fill:#111a1f; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:12.5px; font-weight:600}
  .s-t-s{fill:#6a7b84; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:10.5px}
  .s-t-m{fill:#3b4a53; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px}
  .s-fill-mtg{fill:#0b6a88}
  .s-fill-firms{fill:#8a6008}
  .s-fill-s3{fill:#8a1c6f}
  .s-str-mtg{stroke:#0b6a88}
  .s-arrow{fill:#6a7b84}
  .s-poly{fill:#0b6a88; fill-opacity:.1; stroke:#0b6a88; stroke-width:1.6}
  .s-buf{fill:none; stroke:#bf4318; stroke-width:1.2; stroke-dasharray:5 4}
</style>
<rect x="0" y="0" width="900" height="268" fill="#f2f5f6"/>
    <defs>
      <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6"
              markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="s-arrow"/></marker>
    </defs>
    <!-- legend -->
    <g>
      <rect x="170" y="14" width="13" height="13" rx="2" class="s-box"/>
      <text x="190" y="25" class="s-t-s">wait for next look</text>
      <rect x="316" y="14" width="13" height="13" rx="2"
            style="fill:#bf4318;stroke:none"/>
      <text x="336" y="25" class="s-t-s">provider publishes</text>
      <rect x="462" y="14" width="13" height="13" rx="2" class="s-fill-mtg" style="stroke:none"/>
      <text x="482" y="25" class="s-t-s">our poll interval</text>
    </g>
    <!-- row 1: MTG -->
    <text x="160" y="66" class="s-t-b" text-anchor="end">Meteosat MTG</text>
    <rect x="170" y="52" width="11" height="20" rx="1.5" class="s-box"/>
    <rect x="181" y="52" width="27" height="20" rx="1.5" style="fill:#bf4318"/>
    <rect x="208" y="52" width="4" height="20" rx="1" class="s-fill-mtg"/>
    <text x="224" y="66" class="s-t-m" style="fill:#bf4318;font-weight:600">≈39 min total</text>
    <!-- row 2: FIRMS best -->
    <text x="160" y="118" class="s-t-b" text-anchor="end">FIRMS, best case</text>
    <text x="160" y="132" class="s-t-s" text-anchor="end">pass just happened</text>
    <rect x="170" y="104" width="0" height="20" rx="1.5" class="s-box"/>
    <rect x="170" y="104" width="191" height="20" rx="1.5" style="fill:#bf4318"/>
    <rect x="361" y="104" width="21" height="20" rx="1.5" class="s-fill-mtg"/>
    <text x="394" y="118" class="s-t-m">≈200 min</text>
    <!-- row 3: FIRMS worst -->
    <text x="160" y="170" class="s-t-b" text-anchor="end">FIRMS, worst case</text>
    <text x="160" y="184" class="s-t-s" text-anchor="end">overnight gap</text>
    <rect x="170" y="156" width="509" height="20" rx="1.5" class="s-box"/>
    <rect x="679" y="156" width="191" height="20" rx="1.5" style="fill:#bf4318"/>
    <text x="424" y="170" class="s-t-s" text-anchor="middle">8 h waiting for the next overpass</text>
    <text x="700" y="196" class="s-t-m">≈11 h</text>
    <!-- axis -->
    <line x1="170" y1="216" x2="880" y2="216" class="s-line" marker-end="url(#a2)"/>
    <g class="s-t-m" text-anchor="middle">
      <text x="170" y="236">0</text><text x="276" y="236">100</text>
      <text x="382" y="236">200</text><text x="488" y="236">300</text>
      <text x="594" y="236">400</text><text x="700" y="236">500</text>
      <text x="806" y="236">600</text>
    </g>
    <text x="525" y="256" class="s-t-s" text-anchor="middle">minutes from ignition to alert on your screen</text>
  </svg>
