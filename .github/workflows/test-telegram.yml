# Manually post (or just preview) a test Telegram message, to check delivery end to end.
#
# Defaults to PREVIEW. Clicking "Run workflow" without thinking prints the message and
# does not post it - a test post lands in a real private channel, so the safe option is
# the default one. Mirrors test-sms.yml.
#
# Needs a municipality id (e.g. "zavidovici", "maglaj") because this deployment has
# one private channel per municipality, not one fixed channel - see telegram.py's
# module docstring. There is no single obvious default to test against, the same
# reason cmd_test_telegram takes the id as an argument rather than defaulting.

name: test-telegram

on:
  workflow_dispatch:
    inputs:
      municipality:
        description: "Municipality id to test (e.g. zavidovici)"
        type: string
        required: true
      send:
        description: "Actually post it (leave unchecked to preview only)"
        type: boolean
        default: false

# Read-only: this workflow publishes nothing and commits nothing.
permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    env:
      # The database is here so the test message is built from a real event -
      # exercising the real formatting and the genitive place-name rule.
      FIREWATCH_DATA_DIR: ${{ github.workspace }}/state
      FIREWATCH_CONFIG_DIR: ${{ github.workspace }}/state/config
      # api.telegram.org publishes an AAAA record, and these runners have no IPv6
      # route - without this the post fails with "[Errno 101] Network is
      # unreachable", exactly as FIRMS and httpSMS do. See config.force_ipv4().
      FIREWATCH_FORCE_IPV4: "1"
      FIREWATCH_PUBLIC_URL: https://mirza-basic.github.io/firewatch
      # An env var, not interpolated directly into a run: script - a
      # workflow_dispatch input is attacker-controllable text, and the usual
      # GitHub Actions script-injection risk applies to it like any other
      # untrusted string.
      TEST_MUNICIPALITY: ${{ inputs.municipality }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python3 -m pip install --quiet requests certifi

      - name: Preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p state/config
          # telegram_enabled defaults to false, the same as Sentinel-2 imagery,
          # because it needs a credential nothing else needs - and unlike the
          # token it has no environment variable of its own.
          echo '{"telegram_enabled": true}' > state/config/config.json
          python3 - <<'PY'
          import os
          from firewatch import telegram
          mid = os.environ["TEST_MUNICIPALITY"]
          ok, why = telegram.ready()
          text = telegram.test_text()
          print(f"usable       : {ok} ({why})")
          print(f"municipality : {mid}")
          print(f"channel      : {telegram.channel_for(mid) or '(no channel configured for this municipality yet)'}")
          print(f"bot token    : {'found' if telegram.bot_token() else 'not found'}")
          print(f"map link     : {telegram.map_url()}")
          print(f"length       : {len(text)} chars (limit 4096)")
          print("---- message ----")
          print(text)
          print("------------------")
          PY

      - name: Send
        if: ${{ inputs.send }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p state/config
          echo '{"telegram_enabled": true}' > state/config/config.json
          python3 -m firewatch test-telegram "$TEST_MUNICIPALITY"

      - name: Note
        if: ${{ !inputs.send }}
        run: echo "Preview only — nothing was posted. Re-run with 'send' ticked to deliver it."
