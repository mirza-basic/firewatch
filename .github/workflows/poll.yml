# Poll the satellite feeds, keep the database in the repo, publish the map to Pages.
#
# This is the free, no-card deployment: Actions is unlimited on public repositories
# and Pages hosts the map. Runs are driven by an external scheduler (see `on:` below),
# so the floor is that service's cadence plus however long a runner takes to start.
# Meteosat is already ~25 minutes behind the flame front, so a 10-15 minute external
# cadence puts an alert 30-45 minutes behind it.
#
# Secrets to set under Settings > Secrets and variables > Actions:
#   FIRMS_MAP_KEY     required for VIIRS/MODIS; without it that feed is skipped and
#                     Meteosat + Sentinel-3 still run
#   HTTPSMS_API_KEY   optional, for SMS alerts
#   HTTPSMS_FROM      optional, the gateway phone number
#   FIREWATCH_SMS_TO  optional, comma-separated recipients. This is why it exists:
#                     a phone number must not be committed to a public repository.

name: poll

# Triggered from outside, not on a cron. GitHub's own scheduler has a five-minute
# floor and drifts 5-30 minutes under load; an external caller hits
#   POST /repos/{owner}/{repo}/actions/workflows/poll.yml/dispatches
# on whatever cadence it likes, so the interval is the caller's to choose. A cadence
# under 10 minutes buys nothing: MTG publishes a new slice every 10 minutes with
# ~25 minutes of latency, so faster polling only burns runs.
on:
  workflow_dispatch: {}          # the external trigger, and the Actions tab button

# The workflow commits the database back, which needs write access.
permissions:
  contents: write
  pages: write
  id-token: write

# A run that overlaps another would fight over the database and the push. Queue
# instead: the poller is idempotent, so a skipped-then-later run loses nothing.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Job level, not step level: the commit step below needs FIREWATCH_DATA_DIR too,
    # and a step's `env` block is visible only to that step. Secrets stay scoped to
    # the one step that needs them - the commit step runs `git push` and has no
    # business seeing an API key.
    env:
      FIREWATCH_DATA_DIR: ${{ github.workspace }}/state
      FIREWATCH_PUBLIC_DIR: ${{ github.workspace }}/public
      FIREWATCH_CONFIG_DIR: ${{ github.workspace }}/state/config
      # GitHub's runners have no IPv6 egress, and FIRMS is the one host we talk to
      # that publishes an AAAA record - so requests picked IPv6 and every FIRMS fetch
      # died with "[Errno 101] Network is unreachable" after ~90s of retries, while
      # Meteosat and Sentinel-3 (A records only) worked fine.
      FIREWATCH_FORCE_IPV4: "1"
      # The address an SMS should point at. Without this, map_url() asks the local
      # ngrok agent - which does not exist here - and the alert loses its map link,
      # the one line you most want when a fire notification arrives.
      FIREWATCH_PUBLIC_URL: https://mirza-basic.github.io/firewatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Two dependencies, not four: rumps and pyobjc are the macOS menu bar and
      # nothing here imports them.
      - run: python3 -m pip install --quiet requests certifi

      - name: Poll
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          HTTPSMS_API_KEY: ${{ secrets.HTTPSMS_API_KEY }}
          HTTPSMS_FROM: ${{ secrets.HTTPSMS_FROM }}
          FIREWATCH_SMS_TO: ${{ secrets.FIREWATCH_SMS_TO }}
        run: |
          mkdir -p state/config public
          # auto_expose must stay off: there is no ngrok agent here, and leaving it
          # on makes every run waste time failing to build a tunnel.
          echo '{"auto_expose": false}' > state/config/config.json
          python3 -m firewatch poll

      - name: Commit the database back, but only when something actually changed
        run: |
          git config user.name  "firewatch[bot]"
          git config user.email "firewatch@users.noreply.github.com"

          # Committing on every run would be a commit per trigger - at a 15-minute
          # cadence, 2,880 a month, each storing a fresh copy of the database. The
          # repo would balloon for no information.
          # snapshot.json and the meta table change every cycle by design, so bytes
          # are the wrong test. Detection count is the semantic one.
          COUNT=$(python3 -c "import sqlite3,os,pathlib; d=pathlib.Path(os.environ['FIREWATCH_DATA_DIR'])/'firewatch.db'; print(sqlite3.connect(d).execute('SELECT COUNT(*) FROM detections').fetchone()[0] if d.exists() else 0)")
          PREV=$(cat state/.detections 2>/dev/null || echo -1)
          echo "detections: $PREV -> $COUNT"

          # Stage the database ONLY when the count moved. meta.last_cycle is
          # rewritten every cycle, so the file's bytes change on every run even when
          # nothing was detected - `git add -A state` would therefore commit a fresh
          # 188 KB blob every run, hundreds of megabytes a month carrying no new
          # information.
          if [ "$COUNT" != "$PREV" ]; then
            echo "$COUNT" > state/.detections
            git add state/firewatch.db state/.detections
          fi
          git add state/config
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -q -m "state: $COUNT detections @ $(date -u +%Y-%m-%dT%H:%MZ)"
            # Retry around a rebase. A plain push fails if anything else landed on
            # main meanwhile - a hand push, or an overlapping run - and a failed push
            # here does more than redden the run: the notified rows and the new
            # detections are lost with the workspace, so the next cycle re-fetches
            # the same fire and texts about it a second time.
            pushed=0
            for attempt in 1 2 3; do
              if git push 2>/dev/null; then pushed=1; break; fi
              echo "push rejected (attempt $attempt), rebasing onto origin/main"
              git pull --rebase --autostash -q origin "${{ github.ref_name }}" || break
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::could not push state - the next run may re-alert on the same fire"
              exit 1
            fi
          fi

      # The documentation ships with the map, at /docs/. A Pages deploy replaces the
      # whole site, so this cannot be a workflow of its own: a deploy that published
      # only the map would delete /docs, and one that published only the docs would
      # take the map - the URL that goes out in every SMS - off the air.
      #
      # Rebuilt from docs/*.html on every run rather than committed: it needs no
      # network, costs a fraction of a second, and cannot drift from the sources.
      # The wrapping is the point - see the module docstring.
      - name: Build the documentation into the site
        run: python3 deploy/build-site.py public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publish:
    needs: poll
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
